const PS=[[[0,24],[1,3],[2,3],[3,2]],[[0,6],[1,8],[2,7],[3,3]]],CL=['#2f6bff','#8a5cf6','#e8a317','#16905f'],C3=[0x5b8cff,0xa78bfa,0xe8a317,0x3ddc97];
const HI={FCFS:'Efecto convoy: los procesos cortos esperan detrás del largo.',SJF:'El más corto primero minimiza el tiempo de espera promedio, pero necesita conocer la ráfaga.',SRTF:'Como SJF pero expropiativo: si llega uno más corto que lo que le queda al actual, lo desplaza.',RR:'Cada proceso usa la CPU como máximo un cuanto y vuelve al final de la cola.'};
function sim(PD,alg,q){const P=PD.map(([a,b],i)=>({i,a,b,r:b,f:0}));let t=0,cur=null,qt=0,rq=[],g=[],n=0;
 while(n<P.length&&t<300){P.forEach(p=>{if(p.a==t)rq.push(p)});
  if(cur&&alg=='RR'&&qt>=q){rq.push(cur);cur=null}
  if(cur&&alg=='SRTF'&&rq.some(x=>x.r<cur.r)){rq.push(cur);cur=null}
  if(!cur&&rq.length){if(alg=='FCFS'||alg=='RR')cur=rq.shift();else{cur=rq.reduce((m,x)=>x.r<m.r?x:m);rq.splice(rq.indexOf(cur),1)}qt=0}
  if(cur){g.push(cur.i);cur.r--;qt++;if(!cur.r){cur.f=t+1;n++;cur=null}}else g.push(-1);t++}
 return{g,P}}
function labC(el){
 el.innerHTML=`<div class="bar"><select id="al"><option>FCFS</option><option>SJF</option><option>SRTF</option><option>RR</option></select><select id="ps"><option value="0">Procesos: 24, 3, 3 y 2 ms</option><option value="1">Procesos: 6, 8, 7 y 3 ms</option></select><label id="ql" hidden>cuanto <input id="q" type="number" min="1" max="10" value="4" style="width:60px"></label><button id="go">Simular</button></div><div id="out"></div>`;
 let G,rev=0,tot=0;
 three(el,(sc,cam)=>{cam.position.set(0,7,10);G=new THREE.Group();sc.add(G);return()=>{if(rev<tot){rev+=.5;G.children.forEach(m=>{if(m.userData.t!=null)m.visible=m.userData.t<rev})}sw(cam)}});
 const run=()=>{const al=$('#al').value,{g,P}=sim(PS[$('#ps').value],al,+$('#q').value||4);$('#ql').hidden=al!='RR';
  const w=P.map(p=>p.f-p.a-p.b),avg=(w.reduce((x,y)=>x+y,0)/w.length).toFixed(2);
  if(G){G.clear();const n=g.length,u=.34,x0=-n*u/2;P.forEach((p,i)=>{const z=(i-1.5)*1.3;lb(G,x0-.9,.4,z,'P'+(i+1)).userData={};
   for(let t=p.a;t<p.f;t++){const r=g[t]==i,m=new THREE.Mesh(new THREE.BoxGeometry(u*.92,r?1:.15,1),mat(r?C3[i]:0x6b7aa8,r?.35:.05));m.position.set(x0+t*u+u/2,r?.5:.08,z);m.userData={t};m.visible=false;G.add(m)}});rev=0;tot=n+4}
  $('#out').innerHTML=`<table><tr><th></th><th>Llega</th><th>Ráfaga</th><th>Termina</th><th>Espera</th></tr>${P.map((p,i)=>`<tr><td style="color:${CL[i]}"><b>P${i+1}</b></td><td>${p.a}</td><td>${p.b}</td><td>${p.f}</td><td>${w[i]}</td></tr>`).join('')}</table><div class="rd"><b>Espera promedio: ${avg} ms</b><br>${HI[al]}<br>Cada fila es un proceso. Barra alta: usa la CPU. Barra baja: espera en la cola de preparados.</div>`};
 $('#go').onclick=run;$('#al').onchange=run;$('#ps').onchange=run;$('#q').onchange=run;run();
 return i=>{$('#al').selectedIndex=[0,1,2,3,3][i];run()};
}

  const sl=[0,1,2].map(k=>{const m=new THREE.Mesh(new THREE.BoxGeometry(1.8,.1,1.5),mat(0x4a5a9a,.1));m.position.set(-2.4+k*2.4,.2,0);sc.add(m);return m});
  return()=>{sl.forEach((s,k)=>s.visible=k<+$('#cp').value);
   msgs.forEach(o=>{const m=o.m;let t=[-4.2,1,0],z=1;if(o.loc=='q')t=[-2.4+q.indexOf(o)*2.4,.7,0];else if(o.loc=='B')t=[4.2,1,0];else if(o.loc=='gone'){t=[6,1,0];z=.01}
    m.position.x+=(t[0]-m.position.x)*.1;m.position.y+=(t[1]-m.position.y)*.1;m.scale.setScalar(m.scale.x+(z-m.scale.x)*.12);if(o.loc=='gone'&&m.scale.x<.03){sc.remove(m);o.dead=1}});

 const newMsg=()=>{const m=new THREE.Mesh(new THREE.BoxGeometry(.9,.9,.9),mat(0xe8a317,.5));m.position.set(-5,1,0);sc0.add(m);const o={m,loc:'A',n:++n};msgs.push(o);return o};
 const deliver=o=>{o.loc='B';TM.push(setTimeout(()=>o.loc='gone',1300))};
 rst=()=>{msgs.forEach(o=>o.loc='gone');q=[];pS=null;pR=false;st();say('Pulsa send() varias veces: cuando el búfer se llena, A se bloquea. Luego pulsa receive().')};
 $('#sd').onclick=()=>{const as=$('#md').value=='a',C=+$('#cp').value;

 $('#cp').onchange=rst;$('#md').onchange=rst;rst();

{cap:3,t:'Historia de los sistemas operativos',d:'Cinco generaciones, desde ENIAC hasta Linux.',ic:'h',run:labH,
 st:[['Primera generación (1945-55): sin sistema operativo','Los ordenadores usaban válvulas de vacío y se programaban directamente en lenguaje máquina. No existía ningún sistema operativo: quien programaba controlaba toda la máquina. ENIAC (1945) se usó para calcular tablas de tiro de artillería y el IBM 701 (1953) fue el primer ordenador comercial de IBM.'],['Segunda generación (1955-64): lotes y monitores','Con los transistores aparecen los monitores del sistema y el procesamiento por lotes: cargar y ejecutar un trabajo automáticamente cuando termina el anterior. GM-NAA I/O (1956), hecho por General Motors para el IBM 704, se considera el primer sistema operativo. Se usan ensamblador, FORTRAN y COBOL.'],['Tercera generación (1965-68): multiprogramación','Con los circuitos integrados llegan los sistemas multiprogramados. IBM OS/360, para el mainframe System/360, se anunció en 1964 y salió en 1966, con un año de retraso. Fue un proyecto tan grande que ayudó a dar forma a la ingeniería del software.'],['Cuarta generación (1965-80): tiempo compartido','Los microprocesadores traen el tiempo compartido, los terminales, los programas interactivos y las máquinas virtuales. Multics introdujo el sistema de archivos jerárquico y de él nació UNIX (1970): muchas herramientas pequeñas que trabajan juntas y dispositivos tratados como archivos. VM/CMS de IBM virtualizó el hardware.'],['Quinta generación (desde 1980): el ordenador personal','Aparecen los sistemas de escritorio y las interfaces gráficas. MS-DOS (1981) no tenía modo dual, así que el error de una aplicación podía tumbar todo el sistema. Macintosh (1984) popularizó la interfaz gráfica, Linux (1991) unió el núcleo de Linus Torvalds con las herramientas GNU y Windows NT (1993) trajo un sistema moderno.']],

{cap:5,t:'Servicios del sistema',d:'Qué ofrece el sistema operativo a programas y usuarios.',ic:'s',run:labS,

{cap:9,t:'Procesos',d:'Estados, PCB y cambio de contexto.',ic:'p',run:labP,
 st:[['Programa y proceso','Un programa es un archivo ejecutable; un proceso es ese programa en ejecución. Incluye código, datos, BSS, pila (variables locales), montón (memoria dinámica) y su estado de ejecución. Dos procesos del mismo programa comparten el código, pero todo lo demás es propio de cada uno.'],['Los cinco estados','Nuevo, preparado, ejecutando, esperando y terminado. Solo un proceso por CPU está ejecutando. Cuando termina una operación de E/S, el proceso pasa de esperando a preparado, nunca directamente a ejecutando. Mueve la esfera con los botones.'],['El PCB','Es la ficha del proceso dentro del sistema: PID, estado, contador de programa, registros de la CPU, datos de planificación, de memoria y de E/S. Mientras ejecuta, el contador está en la CPU y solo se copia al PCB cuando el proceso sale de ella.'],['Cambio de contexto','Para darle la CPU a otro proceso, el sistema guarda el estado del actual en su PCB y carga el del siguiente. Es sobrecarga pura: mientras ocurre, ningún proceso avanza.']],
 q:[['Un proceso esperando termina su lectura de disco. ¿A qué estado pasa?',['Ejecutando','Preparado','Terminado'],1],['Mientras un proceso ejecuta, ¿dónde está su contador de programa?',['En su PCB','En la pila','En un registro de la CPU'],2]]},
{cap:10,t:'Planificación de la CPU',d:'FCFS, SJF, SRTF y Round Robin en un Gantt 3D.',ic:'c',run:labC,
 st:[['FCFS: el primero que llega','Cola FIFO sin expropiación. Si un proceso largo llega primero, los cortos esperan detrás: es el efecto convoy. Con el ejemplo de 24, 3, 3 y 2 ms la espera promedio es de 18,75 ms.'],['SJF: el más corto primero','Elige el proceso con la ráfaga más corta y da el menor tiempo de espera promedio. El problema es que el sistema no conoce la ráfaga de antemano y tiene que estimarla.'],['SRTF: SJF con expropiación','Si llega un proceso con menos tiempo que el que le queda al actual, lo expropia. Suele mejorar el tiempo de respuesta, a costa de más cambios de contexto.'],['Round Robin: turnos con cuanto','Cada proceso usa la CPU hasta un cuanto y vuelve al final de la cola. Prueba cuantos distintos: si es muy grande se parece a FCFS y si es muy pequeño se pierde tiempo en cambios de contexto.'],['Cómo se compara un algoritmo','Se mide con el uso de CPU, la tasa de procesamiento, el tiempo de ejecución, el de espera y el de respuesta. En sistemas interactivos importa más que la respuesta sea predecible que su promedio.']],
 q:[['¿Qué algoritmo da el menor tiempo de espera promedio?',['FCFS','SJF','Round Robin'],1],['¿Qué pasa en Round Robin si el cuanto es mayor que todas las ráfagas?',['Se comporta como FCFS','Se comporta como SJF','Mejora el tiempo de espera'],0]]},
{cap:11,t:'Paso de mensajes',d:'send(), receive(), búfer y bloqueo, en 3D.',ic:'m',run:labM,
 st:[['Procesos cooperativos','Los procesos que comparten datos se afectan entre sí y se llaman cooperativos. Para comunicarse hay dos estrategias: memoria compartida o paso de mensajes. Con mensajes, el sistema operativo entrega los datos y se encarga de la sincronización: solo hacen falta send() y receive().'],['Comunicación directa o indirecta','En la directa se nombra al proceso (su PID) y, si cambia, hay que actualizar todas las referencias. En la indirecta se usan buzones o puertos, así los procesos no dependen de identificadores. Las colas de mensajes POSIX son indirectas.'],['Búfer de capacidad cero o limitada','Sin búfer, el emisor se bloquea hasta que el receptor reciba. Con capacidad limitada, solo se bloquea cuando la cola se llena. Un búfer infinito no existe, porque los recursos son limitados. Prueba ambos en la escena.'],['Síncrono o asíncrono','Síncrono: el proceso se bloquea si la cola está llena (al enviar) o vacía (al recibir). Asíncrono: nunca bloquea y devuelve un error para reintentar; en POSIX es -1 con EAGAIN si se abre la cola con O_NONBLOCK.'],['Mecanismos reales','Colas de mensajes POSIX (indirectas, tamaño variable y capacidad limitada), señales (directas, tamaño fijo: solo indican un evento), tuberías (flujo de bytes que no separa los mensajes) y sockets (con AF_INET llegan a procesos de otros ordenadores).']],
 q:[['Con un búfer lleno y envío síncrono, ¿qué ocurre?',['El mensaje se pierde','El emisor se bloquea hasta que haya hueco','El receptor se bloquea'],1],['¿Qué ventaja da la comunicación indirecta?',['Los procesos no dependen del PID del otro','Los mensajes siempre son más rápidos','No necesita sistema operativo'],0]]},
{cap:12,t:'Memoria compartida',d:'Dos procesos, una misma región de memoria.',ic:'r',run:labR,
 st:[['Qué es','Un proceso gana acceso a una región de la memoria de otro, algo que el sistema operativo normalmente evita. Los dos procesos deben acordar compartirla y después leen y escriben en ella sin copiar datos.'],['Responsabilidad de los procesos','La estructura de los datos y la sincronización las deciden los procesos, no el sistema. Sus ventajas son la eficiencia (velocidad de la memoria principal) y la conveniencia (solo hay que leer y escribir).'],['Anónima y con nombre','La anónima se crea con mmap() y MAP_SHARED y se comparte con los hijos mediante fork(). La que tiene nombre se abre con shm_open() y la ve cualquier proceso con permisos. Con MAP_PRIVATE cada proceso tiene su propia copia: pruébalo con el botón de memoria privada.'],['Sincronizar con un semáforo','En el ejemplo del capítulo el hijo duplica un valor y el padre lo lee. Sin sincronizar, el padre lee a su ritmo y repite valores. Con sem_wait() y sem_post(), el padre espera cada resultado nuevo.']],
 q:[['Un hijo escribe 42 en una región mmap() con MAP_PRIVATE. ¿Qué lee el padre?',['42','0, porque el hijo escribió en su copia','Un error'],1],['Dos programas lanzados por separado quieren compartir memoria. ¿Qué usan?',['shm_open() con el mismo nombre','mmap() anónimo','fork()'],0]]}
];
const CASES=[
 {title:'El ordenador de una sala de cómputo',situation:'Una institución pasa de equipos que se programaban manualmente a ordenadores que ejecutan trabajos de muchos estudiantes. ¿Qué cambios históricos explican que hoy podamos abrir varias aplicaciones y alternar entre ellas?',answer:'La evolución fue acumulativa: los monitores y el procesamiento por lotes automatizaron trabajos; la multiprogramación aprovechó la CPU mientras otro trabajo esperaba; el tiempo compartido permitió interacción entre varios usuarios; y los sistemas personales popularizaron las interfaces gráficas y la multitarea.'},
 {title:'Un laboratorio con recursos compartidos',situation:'En un laboratorio, varios programas quieren usar la CPU, la memoria, una impresora y archivos al mismo tiempo. ¿Por qué no conviene que cada programa controle directamente el hardware?',answer:'El sistema operativo actúa como coordinador. Asigna recursos, registra su uso, protege los procesos y media las operaciones de entrada/salida. Así evita conflictos, accesos indebidos y desperdicio de recursos.'},
 {title:'Dos aplicaciones abiertas al mismo tiempo',situation:'Estás en una videollamada y abres un navegador. El sistema alterna entre ambos, pero uno queda esperando mientras recibe datos de la red. ¿Qué ocurre con sus estados?',answer:'Cada aplicación en ejecución es un proceso independiente. El planificador puede sacar de la CPU al proceso que estaba ejecutando y guardar su contexto en el PCB. Si espera una operación de E/S pasa a esperando; cuando esta termina vuelve a preparado y podrá ser elegido para ejecutar.'},
 {title:'La CPU es una sola, pero hay muchas tareas',situation:'Cuatro procesos llegan casi al mismo tiempo. Uno necesita 24 ms y los demás solo 3, 3 y 2 ms. ¿Qué efecto puede producir FCFS y cómo cambia la experiencia con Round Robin?',answer:'Con FCFS, si el proceso largo llega primero, los cortos esperan detrás: es el efecto convoy. Round Robin reparte la CPU en turnos de duración limitada (cuanto), lo que mejora la capacidad de respuesta percibida en sistemas interactivos, aunque un cuanto demasiado pequeño aumenta el coste de los cambios de contexto.'},
 {title:'Dos procesos deben coordinarse',situation:'Un proceso produce mensajes y otro los consume. La cola tiene capacidad limitada y se llena. ¿Qué sucede con un envío síncrono y qué cambia con uno asíncrono?',answer:'En el modo síncrono, el emisor queda bloqueado hasta que exista espacio en la cola. En el modo asíncrono, la llamada no espera: informa que no pudo enviar (por ejemplo, EAGAIN) y el proceso decide cuándo reintentar. El receptor también puede bloquearse si espera un mensaje en una cola vacía.'},
 {title:'Compartir datos sin duplicarlos',situation:'Un proceso hijo actualiza un contador y el proceso padre necesita leer cada nuevo valor. ¿Por qué compartir memoria no basta para garantizar que el padre lea los datos en el orden correcto?',answer:'La región compartida permite que ambos accedan a los mismos datos, pero no define por sí sola el orden de lectura y escritura. Hace falta sincronización. Un semáforo puede coordinar al productor y al consumidor: el hijo señala que publicó un valor y el padre espera esa señal antes de leerlo.'}
];

 'Reconocer los hitos que llevaron de la ejecución manual a los sistemas actuales.',
